# Internal-only gateway for server-side callers.
#
# The ported functions use supabase-js, which builds `${url}/rest/v1/...` and
# `${url}/auth/v1/...`. They cannot use the public URL: this box cannot reach
# its own public IP (no hairpin NAT), which is why an earlier curl from the
# server to app.catalogshare.online returned nothing at all.
#
# So they get their own origin on loopback. Listening on 127.0.0.1 only means
# this is unreachable from the internet no matter what it exposes.
server {
    listen 127.0.0.1:8088;
    server_name localhost;

    access_log off;

    location /rest/v1/ {
        proxy_pass http://127.0.0.1:3002/;
        proxy_set_header Host $host;
    }

    location /auth/v1/ {
        proxy_pass http://127.0.0.1:9999/;
        proxy_set_header Host $host;
    }

    location /storage/v1/ {
        proxy_pass http://127.0.0.1:5013/;
        proxy_set_header Host $host;
        client_max_body_size 20M;
    }

    location = /health {
        default_type text/plain;
        return 200 "internal gateway ok\n";
    }
}
