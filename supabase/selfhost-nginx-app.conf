# app.catalogshare.online — CatalogShare.
#
# A static Vite/React SPA; there is no backend on this box. The app talks
# straight to Supabase and Razorpay from the browser, so nginx only ever serves
# files from disk.
#
# Unlike every other vhost here, this host is NOT behind Cloudflare — its A
# record points straight at this server. That is why it uses a Let's Encrypt
# certificate instead of /etc/ssl/cloudflare/origin.crt (which browsers only
# trust when Cloudflare terminates the connection), and why the
# cloudflare-realip snippet is deliberately not included: $remote_addr here is
# already the real visitor.
#
# The symlink in sites-enabled is named zz-app.catalogshare.online on purpose.
# nginx picks the FIRST server block as the implicit default for a port, and
# only :443 has an explicit default_server. Sorting this file last keeps
# hostingsignal the :80 default exactly as it was before this site existed.

server {
    listen 80;
    listen [::]:80;
    server_name app.catalogshare.online;

    # Certbot renews over HTTP-01, so this must stay reachable on :80 and must
    # be matched before the redirect below.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/app.catalogshare.online/acme;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # nginx here predates 1.25.1, so http2 is a listen flag, not its own
    # directive. Matches how the other vhosts on this box declare it.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.catalogshare.online;

    ssl_certificate     /etc/letsencrypt/live/app.catalogshare.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.catalogshare.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSLappcatalogshare:10m;
    ssl_session_timeout 1d;
    # OCSP stapling is deliberately absent: certificates issued by Let's Encrypt
    # since 2025 carry no OCSP responder URL, so enabling it only logs a warning
    # on every reload.

    root /var/www/app.catalogshare.online/public;
    index index.html;

    # Every request header supabase-js can put on a cross-origin call, in one
    # place. The preflight answer has to name each one: a header missing from
    # this list makes the WebView drop the real request before it is sent, and
    # the app reports it as a network failure. That is exactly what happened to
    # photo uploads - storage-js adds `x-upsert` to every upload, the list did
    # not have it, and the APK could create products but never attach a photo.
    set $cors_allow_headers "authorization, apikey, content-type, x-client-info, x-supabase-api-version, prefer, range, accept-profile, content-profile, accept, origin, x-upsert, cache-control, x-metadata, duplex, if-match, if-none-match";

    client_max_body_size 25M;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json image/svg+xml application/manifest+json;

    # X-Frame-Options is DENY rather than the SAMEORIGIN used by the shared
    # snippet: this app has no frames of its own and handles payment flows.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(self), payment=(self), usb=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/app.catalogshare.online/acme;
        default_type "text/plain";
    }

    # Vite writes a content hash into every filename under /assets, so these can
    # never go stale — a changed file gets a new name.
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html is the one file whose URL never changes, so it must not be
    # cached: a stale copy would reference asset hashes that no longer exist.
    # add_header does not inherit into a location that sets its own, so the
    # security headers are repeated here rather than silently dropped.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(self), payment=(self), usb=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # ---------------------------------------------------------------------
    # Self-hosted backend: GoTrue (auth) and PostgREST (data).
    #
    # Mounted under /backend on the app's own origin rather than on a separate
    # api.* host, because that would need a new DNS record and a second
    # certificate. supabase-js builds its URLs as `${url}/auth/v1/...` and
    # `${url}/rest/v1/...`, so pointing it at
    # https://app.catalogshare.online/backend lands exactly here.
    #
    # Same-origin has a second benefit: no CORS preflight on every request, and
    # no third-party-cookie question for the auth session.
    #
    # The trailing slash on each proxy_pass is load-bearing. It strips the
    # matched prefix, so /backend/rest/v1/plans reaches PostgREST as /plans.
    # Without it PostgREST would look for a table called "backend".
    # ---------------------------------------------------------------------
    # Public reads served straight off disk. Proxying them through Node would
    # add a hop and lose nginx's sendfile path for no benefit - the bucket is
    # public by definition, so there is nothing to authorise on a read.
    #
    # This block must come BEFORE the upload proxy: nginx picks the longest
    # matching prefix, so the more specific /public/ path wins regardless of
    # order, but keeping them adjacent makes the pairing obvious.
    location ^~ /backend/storage/v1/object/public/ {
        add_header Access-Control-Allow-Origin "*" always;

        alias /var/www/catalogshare-storage/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # Uploaded files are user content on our own origin. Without this a
        # crafted SVG or HTML file becomes stored XSS on app.catalogshare.online.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'" always;
        access_log off;
        try_files $uri =404;
    }

    location ^~ /backend/storage/v1/ {
        # CORS for the native app.
        #
        # The APK runs from https://localhost, so these calls are cross-origin
        # and the WebView sends an OPTIONS preflight first. Answer it here and
        # short-circuit: the upstream never sees it.
        #
        # Deliberately preflight-only. The upstreams already set
        # Access-Control-Allow-Origin on real responses, and a duplicate header
        # makes the browser reject the response outright.
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, PATCH, PUT, DELETE, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers $cors_allow_headers always;
            add_header Access-Control-Expose-Headers "content-range, content-length, x-total-count" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0;
            add_header Content-Type "text/plain";
            return 204;
        }

        add_header Access-Control-Allow-Origin "*" always;

        proxy_pass http://127.0.0.1:5013/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Must exceed the service's own 15MB ceiling, or nginx rejects a legal
        # upload before the service can answer with a useful message.
        client_max_body_size 20M;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
        access_log /var/log/nginx/backend-storage.access.log;
    }

    # Ported Supabase Edge Functions.
    #
    # /functions/v1/<name> is exactly the path supabase-js builds for
    # functions.invoke("<name>"), so the client needed no change beyond the base
    # URL it already had.
    location ^~ /backend/functions/v1/ {
        proxy_pass http://127.0.0.1:5014/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Razorpay verification calls out to their API and back; the email
        # function talks to Resend. 60s covers both without holding a socket
        # open for a hung upstream.
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        access_log /var/log/nginx/backend-functions.access.log;
    }

    location ^~ /backend/auth/v1/ {
        # CORS for the native app.
        #
        # The APK runs from https://localhost, so these calls are cross-origin
        # and the WebView sends an OPTIONS preflight first. Answer it here and
        # short-circuit: the upstream never sees it.
        #
        # Deliberately preflight-only. The upstreams already set
        # Access-Control-Allow-Origin on real responses, and a duplicate header
        # makes the browser reject the response outright.
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, PATCH, PUT, DELETE, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers $cors_allow_headers always;
            add_header Access-Control-Expose-Headers "content-range, content-length, x-total-count" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0;
            add_header Content-Type "text/plain";
            return 204;
        }

        proxy_pass http://127.0.0.1:9999/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
        access_log /var/log/nginx/backend-auth.access.log;
    }

    location ^~ /backend/rest/v1/ {
        proxy_pass http://127.0.0.1:3002/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # PostgREST streams large result sets; buffering the whole body would
        # hold a catalogue export in memory for no benefit.
        proxy_buffering off;
        proxy_read_timeout 60s;
        access_log /var/log/nginx/backend-rest.access.log;
    }

    # AdMob rewarded-ad server-side verification.
    #
    # ^~ so it wins over the SPA fallback below: a regex-free prefix match with
    # ^~ stops nginx trying any other location, which is what keeps Google's
    # callback from being answered with index.html.
    #
    # No security-headers include here. This is a machine endpoint; HSTS and the
    # frame options are meaningless to it, and add_header in a location would
    # drop the server-level set anyway.
    location ^~ /api/admob-ssv {
        proxy_pass http://127.0.0.1:5010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Google gives up quickly and retries; do not hold the connection.
        proxy_read_timeout 15s;
        proxy_connect_timeout 5s;
        access_log /var/log/nginx/admob-ssv.access.log;
    }

    # Client-side routing: /store/<slug>, /invoices/... etc. are React Router
    # paths with no file behind them, so anything unmatched falls back to the
    # SPA shell rather than 404ing.
    # Legal documents.
    #
    # Served from a directory OUTSIDE the web release on purpose. deploy-web.sh
    # atomically swaps /var/www/app.catalogshare.online/public on every deploy,
    # so a page regenerated from the database into the release would silently
    # revert to whatever was bundled at build time the next time the site was
    # deployed - exactly the drift this whole arrangement removes. ^~ makes this
    # win over the release directory regardless of what is in it.
    #
    # The @spa fallback covers a document that exists in the database but has no
    # static file yet (just created, or never republished): the app renders it
    # from the table instead of 404ing.
    location ^~ /legal/ {
        alias /var/www/catalogshare-legal/;
        try_files $uri $uri.html $uri/index.html @spa;
        add_header Cache-Control "public, max-age=300" always;
    }

    location @spa {
        root /var/www/app.catalogshare.online/public;
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Dotfiles stay hidden, but /.well-known must keep working for ACME and for
    # the Android App Links assetlinks.json.
    location ~ /\.(?!well-known) {
        deny all;
    }

    access_log /var/log/nginx/app.catalogshare.online.access.log;
    error_log  /var/log/nginx/app.catalogshare.online.error.log;
}
