# Self-hosted CatalogShare backend.
#
# Replaces the two Supabase services the app actually talks to: GoTrue for auth
# and PostgREST for data. The database is the SYSTEM Postgres 16 already on this
# box, not another container - one less moving part, one less thing to back up
# separately, and psql works without docker exec.
#
# network_mode: host on purpose. Both services need 127.0.0.1:5432, and putting
# them on the host network means Postgres keeps listening only on loopback
# instead of being opened to the docker bridge. Each service binds its own port
# to 127.0.0.1, so nothing here is reachable from the internet except through
# nginx.

services:
  auth:
    image: supabase/gotrue:v2.177.0
    container_name: catalogshare-auth
    restart: unless-stopped
    network_mode: host
    environment:
      GOTRUE_API_HOST: 127.0.0.1
      PORT: "9999"
      API_EXTERNAL_URL: https://app.catalogshare.online/backend/auth

      GOTRUE_DB_DRIVER: postgres
      DATABASE_URL: postgres://supabase_auth_admin:${AUTH_ADMIN_PASSWORD}@127.0.0.1:5432/${DB_NAME}?search_path=auth&sslmode=disable

      GOTRUE_SITE_URL: https://app.catalogshare.online
      GOTRUE_URI_ALLOW_LIST: https://app.catalogshare.online,https://app.catalogshare.online/*,https://localhost,https://localhost/*,capacitor://localhost,capacitor://localhost/*
      GOTRUE_DISABLE_SIGNUP: "false"

      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_ISSUER: https://app.catalogshare.online/backend/auth

      # No SMTP is wired up yet, so a signup that waited for a confirmation
      # email would strand every new merchant. Autoconfirm keeps registration
      # working; turn this off in the same change that adds SMTP, not before.
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_SMS_AUTOCONFIRM: "true"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"

      # ---- Sign in with Google ------------------------------------------
      # All four come from /opt/catalogshare-backend/.env, which the reconcile
      # script rewrites from integration_secrets - the operator pastes the
      # client id and secret into the admin console, never into this file.
      # ENABLED is derived by that script and is only "true" once BOTH values
      # are present: GoTrue refuses to start a provider with a blank secret,
      # and a half-configured provider would take every other sign-in down
      # with it at the next restart.
      #
      # The redirect URI is what Google calls back after consent. nginx maps
      # /backend/auth/v1/ onto GoTrue's root, so /callback lands on GoTrue's
      # own handler. It must match the Web client's "Authorized redirect URI"
      # in Google Cloud Console character for character.
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${GOOGLE_SIGN_IN_ENABLED:-false}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: https://app.catalogshare.online/backend/auth/v1/callback
      # Lets a signed-in merchant attach (and detach) a Google identity to the
      # account they already have, instead of ending up with two accounts. The
      # website uses GoTrue's own link endpoint; the app goes through the
      # link-google function because Google blocks its consent page in WebViews.
      GOTRUE_SECURITY_MANUAL_LINKING_ENABLED: "true"

      GOTRUE_PASSWORD_MIN_LENGTH: "6"
      GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED: "true"
      GOTRUE_SECURITY_REFRESH_TOKEN_REUSE_INTERVAL: "10"
      GOTRUE_LOG_LEVEL: info

      # ---- Email -------------------------------------------------------
      # All of these come from /opt/catalogshare-backend/.env, which the
      # reconcile script rewrites from integration_secrets - the operator fills
      # them in from the admin console, never in this file. They interpolate
      # here so a console edit actually reaches GoTrue.
      #
      # THE PASSWORD IS THE LOAD-BEARING ONE. It used to be a blank literal here
      # while the reconcile script wrote RESEND_API_KEY to .env - so the key was
      # set but GoTrue never read it, SMTP stayed dead, and turning autoconfirm
      # off would have stalled every signup on an email that never sends. It now
      # reads ${RESEND_API_KEY}. Defaults keep a Resend setup working with only
      # the API key pasted in.
      #
      # AUTOCONFIRM STAYS TRUE until the password is actually set (the reconcile
      # script flips it off in the same run that first sees a password), because
      # turning it off first would stall every registration on a confirmation
      # email that cannot be sent.
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-smtp.resend.com}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-465}
      GOTRUE_SMTP_USER: ${SMTP_USER:-resend}
      GOTRUE_SMTP_PASS: ${RESEND_API_KEY:-}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_FROM:-catalogshare123@gmail.com}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_FROM_NAME:-CatalogShare}
      GOTRUE_MAILER_URLPATHS_RECOVERY: /reset-password
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /login
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /account
      GOTRUE_MAILER_SUBJECTS_RECOVERY: Reset your CatalogShare password
      GOTRUE_MAILER_SUBJECTS_CONFIRMATION: Confirm your CatalogShare account


  rest:
    image: postgrest/postgrest:v12.2.3
    container_name: catalogshare-rest
    restart: unless-stopped
    network_mode: host
    environment:
      PGRST_DB_URI: postgres://authenticator:${AUTHENTICATOR_PASSWORD}@127.0.0.1:5432/${DB_NAME}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_JWT_AUD: authenticated
      PGRST_SERVER_HOST: 127.0.0.1
      PGRST_SERVER_PORT: "3002"
      # 3002 because 3001 is already taken by another app on this box.
      # The app reads a row back after writing it in several places; without
      # this PostgREST returns 204 and those reads come back empty.
      PGRST_DB_MAX_ROWS: "10000"
      PGRST_DB_EXTRA_SEARCH_PATH: public, extensions
      PGRST_LOG_LEVEL: error
