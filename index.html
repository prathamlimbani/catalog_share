<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover is required for env(safe-area-inset-*) to resolve to
       anything other than 0 — without it the notch/gesture-bar padding is inert. -->
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0" />
  <title>CatalogShare — Create & Share Product Catalogs</title>
  <meta name="description"
    content="CatalogShare helps businesses create beautiful, shareable product catalogs with a single link." />
  <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
  <meta name="author" content="Pratham Limbani" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" href="/logo-icon.png" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="theme-color" content="#FFFFFF" />
  <script>
    // Runs before the stylesheet paints, so the very first frame is already the
    // right theme. Defaults to the device setting; an explicit choice wins.
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        var dark = saved === 'dark' ||
          (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', dark ? '#0B1020' : '#FFFFFF');
      } catch (e) { /* storage blocked - fall through to light */ }
    })();
  </script>

  <meta property="og:title" content="CatalogShare — Create & Share Product Catalogs" />
  <meta property="og:description"
    content="CatalogShare helps businesses create beautiful, shareable product catalogs with a single link." />
  <meta property="og:type" content="website" />

  <meta name="twitter:card" content="summary" />
  <meta name="twitter:site" content="@catalogshare" />
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-25W133Z9E9"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-25W133Z9E9');
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
