# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx1536m

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# Capacitor 8 compiles its plugins against Java 21. This machine's default JDK
# is 17, so point Gradle at the portable JDK 21 explicitly rather than relying
# on JAVA_HOME — that way `gradlew.bat` works from any shell.
# Change this path if you install the JDK somewhere else.
org.gradle.java.home=C:/Java/jdk-21.0.12+8

# @capgo/capacitor-social-login provider selection.
#
# The plugin ships Facebook, Apple and Twitter SDKs alongside Google and turns
# them ALL on by default. We only use Google, so the others are switched off
# here — Facebook especially, because bundling its SDK trips Play's data-safety
# scanners for a login method the app does not offer. capacitor.config.ts sets
# the same providers, but that only takes effect if the plugin's sync hook runs;
# `npx cap sync` does not run it, and the plugin reads these root properties
# directly, so this is the reliable place. Keep both in step.
socialLogin.google.include=true
socialLogin.google.dependencyType=implementation
socialLogin.facebook.include=false
socialLogin.facebook.dependencyType=compileOnly
socialLogin.apple.include=false
socialLogin.apple.dependencyType=compileOnly
socialLogin.twitter.include=false
socialLogin.twitter.dependencyType=compileOnly
